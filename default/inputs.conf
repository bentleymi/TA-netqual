[script://$SPLUNK_HOME/etc/apps/TA-netqual/bin/netqual_events.py]
interval = 60
index = main
sourcetype = netqual:status
source = status
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-netqual/bin/netqual_metrics.py]
interval = 60
index = metrics
sourcetype = netqual:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-netqual/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14
